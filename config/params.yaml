network:
  interface: eth0
  domain_id: 0

robot:
  speed_level: 1            # 0=慢 1=正常 2=快, 对应 SportClient.SpeedLevel
  startup_grace_sec: 1.5
  stop_grace_sec: 1.0
  velocity_hz: 20           # 后台 Move spam 频率 (sport_mode 要求 ~20Hz)
  max_vx: 0.5               # 速度饱和 (m/s), 任何 set_velocity 超过会被夹断
  max_vy: 0.3
  max_vyaw: 1.0

camera:
  width: 1280
  height: 720
  fps: 30
  roi_top_ratio: 0.50         # 切掉天花板/墙/椅子, 只看下半屏地面
  roi_bottom_ratio: 0.95
  ipm_src_ratio:
    tl: [0.30, 0.55]
    tr: [0.70, 0.55]
    br: [1.00, 0.95]
    bl: [0.00, 0.95]
  ipm_dst_size: [400, 400]
  fisheye_balance: 0.0

vision:
  # ⚠ Go2 EDU 前置鱼眼相机色彩特性: 实拍黄色 H≈33 S≈44 V≈240 (偏白的黄色)
  # 跟手机截图渲染显示的色彩不同, 必须用相机实拍图测出的真实 HSV.

  # ===== 推荐: 多组 HSV 取并集 (覆盖不同光照) =====
  # ⚠ H 下限 24: 木地板实测 H 18~23 (暖色木纹=暗黄), 赛道黄 H≈33.
  # H<24 会把木地板大面积误判为黄线 (实测误判 26% ROI). 验证数据:
  #   木地板误判 26.4% -> 1.0%, 省赛黄道保留 10.5% -> 10.1% (无损)
  # ⚠ 国赛狗机实拍标定 (wrong_spot.avi): 木地板 H 20~32 S 33~77 V 146~205.
  # 省赛黄道实拍: H≈33 S≈44 V≈240. 区分特征: V (地板≤205 vs 道≥240) + S 阴影段.
  # 验证: 国赛地板 5.8%->0.2%, 训练馆地板 0.2%, 省赛黄道 10.5% 无损.
  yellow_hsv_ranges:
    - [[24, 80, 120], [38, 255, 255]]   # 标准黄
    - [[24, 20, 215], [40, 110, 255]]   # 过曝黄: V≥215 (地板亮部 p95=205 切掉)
    - [[24, 80,  70], [40, 255, 160]]   # 阴影黄: S≥80 (地板暗部 S p95=77 切掉)
  # S 下限 30: 兼容偏白的黄色; V 下限 120: 排除暗色 (黑边/阴影).
  yellow_hsv_lower: [18, 30, 120]
  yellow_hsv_upper: [38, 255, 255]
  # 光线变化补偿: 白蓝地标进入画面会拉动自动曝光/白平衡, 让黄线变低饱和或偏暗.
  # 固定 HSV 先跑; adaptive 只做兜底, 用宽 hue + LAB 黄色通道 + BGR 黄色优势防漏检.
  # ⚠ h_range 必须 ≥24: 木地板 H 16~32, 否则 adaptive 分支整片吞地板.
  # (此处 yaml 会覆盖 yellow_mask.py 的函数默认值, 两边都要对!)
  yellow_adaptive_enabled: true
  yellow_adaptive_h_range: [24, 40]
  yellow_adaptive_s_min: 12
  yellow_adaptive_v_min: 45
  yellow_adaptive_lab_b_min: 138
  yellow_adaptive_lab_b_delta: 8
  yellow_adaptive_rg_delta_min: 25

  # ===== 黄线检测器切换 (现场可一键换) =====
  # hsv = 多组绝对 HSV 阈值 (默认, 省赛验证过)
  # lab = LAB 相对阈值 (光照自适应, 未知场地灯光时切这个)
  lane_detector: hsv
  lab_b_delta_min: 22          # LAB: b - median(b) ≥ 此值 (黄道实测 +40~80, 地板 +3~12)
  lab_hue_range: [20, 40]
  lab_v_min: 60
  lab_rg_delta_min: 25         # min(R,G)-B ≥ 此值 (黄道 80+, 地板 19~39)
  morph_open_kernel: 3
  morph_close_kernel: 7
  min_lane_area_px: 1500

control:
  loop_hz: 30
  # ⚠ 注意 Go2 sport_mode 行走启动门槛: vx 必须 >= ~0.2 m/s, 否则只原地踏步.
  # 所有阶段速度都设到 0.2 以上.
  forward_speed:
    follow: 0.30          # 主巡线 (能看清线就够稳)
    dump_approach: 0.20   # 近倾倒区 (刚好过门槛, 慢但能走)
    fork: 0.25            # 岔路口
    obstacle: 0.22        # 起点障碍区蓝色矩形标记右绕
    stair: 0.20           # 上台阶 (慢且稳)
    dock: 0.20            # 接近充电区
  lateral_pid:
    # 误差已归一化到 [-1, +1], 输出对应 vyaw 角速度 (rad/s).
    # kp=0.6 配 err=-0.42 -> vyaw=-0.25 rad/s 是温和但有效的转向.
    # 实测如果转向太激烈请降到 0.4, 太迟钝升到 0.8.
    kp: 0.6
    ki: 0.0
    kd: 0.2
    out_min: -1.0
    out_max: 1.0
    integral_limit: 50
  lost_lane_timeout_sec: 2.0     # 丢线后多久才进 SEARCH_LANE (大一点避免误触发)
  lost_lane_search_yaw: 0.5
  search_lane_max_sec: 8.0       # SEARCH_LANE 状态最长持续, 超时进 EMERGENCY_STOP
  # 已废弃: 鱼眼广角下黄道几乎永远在视野里, "重现"信号永远成立, 不可用
  lane_recovered_consecutive_frames: 5
  lane_recovered_conf_min: 0.5
  # 地标连续 N 帧消失 = 狗走过去了 (配合 max_prox >= pass_through_min_proximity 使用)
  landmark_lost_consecutive_frames: 8

landmark:
  # 倾倒区: 黄色圆环 + 内部白色 + 黑色字
  dump_min_radius_ratio: 0.10
  dump_min_area_ratio: 0.02
  dump_circularity_min: 0.70
  dump_inner_white_ratio_min: 0.10
  dump_consecutive_frames: 12
  dump_proximity_threshold: 0.58     # 当前帧接近度阈值; 降低后避免黄圆环一直"看到但太远"
  dump_require_obstacle_done: true   # 比赛顺序保护: 避障完成前禁止倾倒, 防起点黑白误触发
  dump_fisheye_backup_enabled: false # 倾倒区入口以 D435i 黑白为准; 鱼眼黄环不直接触发卸料
  dump_ring_side: lower              # 倾倒区沿黄色圆环哪一侧走: lower/upper/left/right
  dump_ring_speed: 0.20              # 沿倾倒圆环慢速前进
  dump_ring_min_follow_sec: 1.0      # 进入圆环后至少走多久才允许卸料
  dump_ring_min_follow_distance_m: 0.25 # 命令积分辅助, 不作真实里程
  dump_ring_max_sec: 8.0             # 圆环跟随最长时间, 防止卡住
  dump_ring_blackwhite_min_confidence: 0.50 # 仅用于记录是否扫到中心黑白字, 不作为倾倒必要条件
  dump_ring_band_ratio: 0.24
  dump_ring_n_strips: 6
  dump_ring_min_pixels_per_strip: 20

  fork_branch_min_area_ratio: 0.02
  fork_split_y_ratio: 0.55
  fork_consecutive_frames: 8         # 提高: 4 -> 8 帧

  # 蓝矩形 (台阶区/充电区/障碍区视觉特征一样, 由 FSM 顺序区分)
  blue_rect_min_area_ratio: 0.02
  blue_rect_inner_white_min: 0.20

  # 起点后障碍区: 蓝色圆环是可走路线, 白色内区/黑字区不可碰; 固定从右侧沿蓝环绕行.
  obstacle_enabled: true
  obstacle_consecutive_frames: 8
  obstacle_ring_enabled: true
  obstacle_ring_direction: right
  obstacle_ring_speed: 0.20
  obstacle_ring_yaw_gain: 0.65
  obstacle_ring_exit_yellow_frames: 8
  obstacle_ring_exit_yellow_conf_min: 0.45
  obstacle_ring_lost_frames: 10
  obstacle_ring_max_sec: 18.0
  blue_ring_min_area_ratio: 0.012
  blue_ring_min_circularity: 0.45
  blue_ring_inner_white_min: 0.25
  blue_ring_inner_black_min: 0.01
  blue_ring_min_confidence: 0.45

  # ---- 避障区脚本化动作 (纯定时 4 段, 现场遥控试好填这里) ----
  # 看到蓝色进入避障区后, 按 seg1→seg2→seg3→seg4→收尾 顺序走.
  # 每段: obstacle_seq_segN_turn = left/right/none (none=直行); _sec = 该段秒数(0=跳过).
  # 收尾段: obstacle_seq_exit_on_yellow=true 则一直直行到看见黄线才退出循线.
  # 全程纯定时不依赖颜色, 不会卡死. max_sec 总超时兜底.
  #
  # 默认猜测: 右转90 → 直行2.5s → 右转90 → 直行2.5s → 见黄线退出.
  # 【现场标定步骤】遥控狗在避障区走一遍正确路线, 记下每段方向+秒数, 改下面数字.
  obstacle_ring_mode: scripted   # scripted=脚本序列; follow=旧的沿蓝环巡线
  obstacle_seq_turn_yaw: 0.6     # 转向角速度 (rad/s)
  obstacle_seq_turn_vx: 0.0      # 转向时前进速度 (0=原地转, 转角更准)
  obstacle_seq_straight_vx: 0.25 # 直行速度 (≥0.22 才能起步走)

  obstacle_seq_seg1_turn: right  # 第1段: 右转
  obstacle_seq_seg1_sec: 2.6     #   转 90° 用时, 现场标到刚好转 90 度
  obstacle_seq_seg2_turn: none   # 第2段: 直行
  obstacle_seq_seg2_sec: 2.5
  obstacle_seq_seg3_turn: right  # 第3段: 再右转
  obstacle_seq_seg3_sec: 2.6
  obstacle_seq_seg4_turn: none   # 第4段: 直行
  obstacle_seq_seg4_sec: 2.5

  obstacle_seq_exit_on_yellow: true   # 收尾: 直行到看见黄线才退出循线
  obstacle_seq_exit_yellow_conf: 0.45 # 黄线置信度门槛
  obstacle_seq_exit_yellow_frames: 4  # 连续几帧见黄线才算稳
  obstacle_seq_exit_max_sec: 8.0      # 收尾等黄线最长时间, 超时也退出
  obstacle_seq_max_sec: 35.0          # 整段避障最长时间, 超时强制退出

  stair_consecutive_frames: 12       # 提高: 6 -> 12 帧, 防止远处闪一下就触发
  stair_proximity_threshold: 0.72     # 蓝色台阶区必须足够近才触发爬楼
  stair_climb_duration_sec: 6.0      # 已废弃 (现在用黄道重现退出 APPROACH_STAIR)

  dock_consecutive_frames: 12
  dock_proximity_threshold: 0.82     # 终点要求更严, 防止远处看到蓝框就停车
  dock_target_distance_m: 0.3

  # 路程判定: 从第一次 vote 通过 (进入 APPROACH_X) 开始, 按 vx × dt 累加路程.
  # 走够指定距离就执行对应动作. **赛前现场调整**, 默认值基于赛道 6300×8800mm 估算.
  dump_walk_distance_m: 1.4          # 看到倾倒区后再走到圆心；太早卸料就调大
  stair_walk_distance_m: 1.8         # 看到台阶区后再走到两条黄线中间；太早停就调大
  stair_through_distance_m: 2.5      # 切步态后再走 ~2.5m 穿过台阶 (台阶区约 1.5m + 余量)
  dock_walk_distance_m: 1.4          # 看到充电区后再走到中心停车；太早停就调大

mission:
  max_duration_sec: 870
  emergency_stop_on_exception: true

dump_action:
  # Go2 EDU 实测: mcf 下 Euler 不生效, ReleaseMode(mcf) 会失去支撑.
  # 比赛最终采用前后方向倒料: sit_rise = 前腿伸直/基本不变,
  # 后腿跪下保持, 再起身恢复. 物料出口请布置到后方.
  # 可选: stretch / sit_rise / scrape / cross_step / pose_stretch / euler
  method: sit_rise
  repeat: 1
  roll_rad: -0.45           # 负=向右倾斜 (物料从右侧滑出). 赛前调幅度 0.3~0.6
  hold_sec: 3.5             # sit_rise=后腿跪下保持时间; euler=倾角保持时间
  spam_hz: 30               # Euler 命令重发频率 (Euler 单帧生效, 必须 spam)

logging:
  level: INFO
  save_video: false
  save_dir: logs

# ============ D435i 辅助 (加装在底部/腹下) ============
realsense:
  enabled: true               # 默认启用加装 D435i: 地标/障碍触发走颜色+深度; 鱼眼只巡黄线
  width: 640
  height: 480
  fps: 30

  # ---- 触发距离 (米) ----
  obstacle_trigger_depth_m: 0.40
  dump_trigger_depth_m: 0.40
  stair_trigger_depth_m: 0.40
  dock_trigger_depth_m: 0.40

  # ---- 避障区脚本的红色识别 (D435i 中央 ROI) ----
  obstacle_red_min_ratio: 0.15      # 红色像素占比 >= 此值算"看到红"
  obstacle_red_trigger_depth_m: 0.60 # 红色目标深度 <= 此值 (或深度无效) 才算数

  n_stable_frames: 5
  min_hits_in_window: 4

  # ---- 起步保护 + 时间冷却 (用时间不用距离, 命令积分不准) ----
  startup_protect_s: 3.0
  cooldown_dump_s: 5.0
  cooldown_obstacle_s: 5.0
  cooldown_stair_s: 8.0
  cooldown_dock_s: 8.0

  # ---- dump → stair 时间间隔保护 ----
  # 当前策略: D435i 识别到白蓝台阶区就直接切爬楼, 不再做固定时间等待.
  dump_to_stair_min_s: 0.0

  # ---- D435i 触发后的动作点微调 ----
  # 倾倒区: D435i 看到黑白区后直接卸料; 以下旧后移参数保留但当前不使用.
  dump_post_trigger_distance_m: 0.45
  dump_post_trigger_timeout_s: 8.0

  # 终点: 起点和终点都是蓝白区域, 但只有 stair_climbed=true 后才会解释为终点.
  # D435i 看到终点蓝白区后, 再纯直行一小段让机身投影更进入充电区域.
  dock_post_trigger_distance_m: 0.55
  dock_post_trigger_timeout_s: 5.0

  # ---- stair 完成后纯直行 (完全不看黄线 vyaw=0, 等 D435i 终点) ----
  dock_blind_walk_speed: 0.25         # m/s, ≥0.22 才能起步 (sport_mode 门槛)
  dock_post_stair_settle_sec: 0.8     # 台阶后先停稳, 再进入终点直行锁定

  # 台阶穿越期间的 vyaw 限幅 (弧度/秒).
  # 0 = 穿台阶纯直行完全不转向 (推荐, 省赛翻车点: 台阶上看到右侧黄线被带歪).
  # >0 = 允许微小修正, 比如 0.08.
  stair_cross_max_yaw: 0.0

  # ---- 底部黄线兜底 ----
  # 前置鱼眼仍是主巡线; 只有前置黄线丢失/低置信时, 底部 D435i 才短时接管纠偏.
  lane_assist:
    enabled: true
    front_confidence_min: 0.45
    bottom_confidence_min: 0.35
    fallback_speed: 0.20              # D435i 兜底时限速, 防止脚下视角反应太晚
    yaw_scale: 0.65                   # D435i 兜底时降低转向增益, 防抖
    error_sign: 1.0                   # 若实测左右反了, 改成 -1.0
    roi_w_ratio: 0.80
    roi_h_ratio: 0.70                 # 取底部画面靠下区域
    depth_min_m: 0.05
    depth_max_m: 0.50
    min_depth_valid_ratio: 0.10
    min_yellow_ratio: 0.015
    n_strips: 6
    min_pixels_per_strip: 30

  blue_ring_assist:
    enabled: true
    min_confidence: 0.35
    roi_w_ratio: 0.90
    roi_h_ratio: 0.80
    depth_min_m: 0.05
    depth_max_m: 0.55
    min_depth_valid_ratio: 0.08
    min_blue_ratio: 0.010
    n_strips: 6
    min_pixels_per_strip: 20

  # ---- 颜色判定 (day + night 双档 OR) ----
  color_stat:
    # 亮度自适应: 偏暗时自动降低"白"的 V 下限, 亮场封顶=base 保持原行为.
    adaptive_enabled: true
    adaptive_white_v_base: 90    # 白色 V 下限基准 (亮场用这个值)
    adaptive_v_ref: 128          # 参考亮度; ROI 中位亮度低于它就按比例放宽白阈值
    roi_w_ratio: 0.60
    roi_h_ratio: 0.60
    depth_min_m: 0.05
    depth_max_m: 0.50
    min_valid_depth_ratio: 0.30
    # day 档 (白天明亮场景)
    white_min_ratio: 0.50
    black_min_ratio: 0.25
    blue_min_ratio: 0.08
    other_max_ratio: 0.20
    yellow_max_ratio: 0.30
    # night 档 (灯光下白底变灰)
    night_enabled: true
    night_white_min_ratio: 0.35
    night_black_min_ratio: 0.30
    # ⚠ 0.06 太松: 国赛白色垫边+淡蓝阴影 b=0.06 正好压线误触发 stair (实拍快照证实).
    # 0.12 为临时值, 待狗鼻贴国赛台阶牌实测后精调.
    night_blue_min_ratio: 0.12
    night_other_max_ratio_blackwhite: 0.10
    night_other_max_ratio_bluewhite: 0.25
    night_blue_dominant_sum: 0.70  # 国赛白底蓝牌 D435i 渲染偏青(白算不进white), 靠蓝占比触发: dock实测0.78 stair0.86
